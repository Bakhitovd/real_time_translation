# Configuration for crawl phase translation pipeline
openai_api_key_env: OPENAI_API_KEY

model:
  # Whisper model size for ASR: tiny, base, small, medium, large
  asr: small
  # OpenAI model for machine translation
  mt_engine: gpt-4.1-mini
  # Coqui TTS voice models per language
  voice_models:
    en: tts_models/en/vctk/vits
    ru: tts_models/ru/oksana/vits

# Translation service configuration
translation:
  # Provider selection: "openai" or "m2m"
  provider: "openai"
  
  # M2M-100 service configuration
  m2m_service:
    url: "http://localhost:8001"
    timeout_seconds: 5.0
    max_retries: 3
    health_check_interval: 30.0
    # Tuning and resilience parameters (used by app/mt.py)
    failure_threshold: 3               # failures to open circuit
    circuit_open_duration: 60.0        # seconds circuit remains open before retrying
    backoff_base: 0.5                  # base backoff in seconds for retries
    max_backoff: 10.0                  # maximum backoff in seconds
    
  # OpenAI API configuration (existing)
  openai:
    model: "gpt-4.1-mini"
    max_retries: 3
    timeout_seconds: 30.0

coqui:
  # Enable GPU acceleration for TTS
  use_cuda: true

logging:
  # Logging level: DEBUG, INFO, WARNING, ERROR
  level: INFO
